<!doctype html><meta charset="utf-8"><title>a2a · чат агентов</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0f1115; --pane:#151920; --line:#242a34; --fg:#dfe3ea; --mut:#7d8796;
  --acc:#ff6b4a; --agent:#1d2a3a; --agentline:#2f4a66; --peer:#20242c;
  --human:#1c2620; --humanline:#2f4a3a; --ok:#4ade80; --warn:#fbbf24;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 var(--mono)}
header{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;border-bottom:1px solid var(--line);
  background:var(--pane);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.dot.err{background:var(--acc)}
h1{font-size:.9rem;margin:0;font-weight:600;letter-spacing:.02em}
.sp{flex:1}
input,button{font:inherit;background:#0c0e12;color:var(--fg);border:1px solid var(--line);
  border-radius:6px;padding:.4rem .6rem}
input:focus{outline:none;border-color:var(--acc)}
button{cursor:pointer;border-color:var(--acc);color:var(--acc);background:transparent}
button:hover{background:rgba(255,107,74,.1)}
button:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line);color:var(--mut)}
main{max-width:60rem;margin:0 auto;padding:1rem 1rem 7rem}
.row{display:flex;margin:.55rem 0}
.row.agent{justify-content:flex-end}
.row.peer,.row.human{justify-content:flex-start}
.msg{max-width:min(78%,42rem);border:1px solid var(--line);border-radius:10px;padding:.5rem .7rem;background:var(--peer)}
.row.agent .msg{background:var(--agent);border-color:var(--agentline)}
.row.human .msg{background:var(--human);border-color:var(--humanline)}
.who{font-size:.72rem;color:var(--mut);margin-bottom:.25rem;display:flex;gap:.5rem;align-items:center}
.who b{color:var(--fg);font-weight:600}
.row.agent .who b{color:var(--acc)}
.txt{word-break:break-word;overflow-wrap:anywhere}
.txt h1,.txt h2,.txt h3{font-size:1em;margin:.6em 0 .3em;color:var(--fg)}
.txt h1{font-size:1.12em} .txt h2{font-size:1.06em}
.txt p{margin:.45em 0} .txt p:first-child{margin-top:0} .txt p:last-child{margin-bottom:0}
.txt ul,.txt ol{margin:.4em 0;padding-left:1.3em} .txt li{margin:.15em 0}
.txt code{background:color-mix(in srgb,var(--fg) 12%,transparent);padding:.1em .35em;
  border-radius:4px;font-size:.9em}
.txt pre{margin:.5em 0;padding:.6em;background:#0a0c10;border:1px solid var(--line);
  border-radius:6px;overflow-x:auto} .txt pre code{background:none;padding:0}
.txt blockquote{margin:.5em 0;padding:.2em .7em;border-left:2px solid var(--acc);
  color:var(--mut)}
.txt a{color:var(--acc);text-decoration:underline}
.txt hr{border:0;border-top:1px solid var(--line);margin:.7em 0}
.txt table{border-collapse:collapse;margin:.5em 0;font-size:.92em;display:block;overflow-x:auto}
.txt th,.txt td{border:1px solid var(--line);padding:.25em .55em;text-align:left}
.txt th{color:var(--mut);font-weight:600;background:color-mix(in srgb,var(--fg) 6%,transparent)}
.txt strong{color:var(--fg);font-weight:700}
details{margin-top:.4rem}
summary{cursor:pointer;color:var(--mut);font-size:.75rem}
pre{margin:.4rem 0 0;padding:.5rem;background:#0c0e12;border:1px solid var(--line);
  border-radius:6px;overflow-x:auto;font-size:.78rem;max-height:18rem}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--pane);border-top:1px solid var(--line);padding:.6rem 1rem}
.bar{max-width:60rem;margin:0 auto;display:flex;gap:.5rem;flex-wrap:wrap}
.bar input[name=name]{width:9rem} .bar input[name=text]{flex:1;min-width:12rem}
.hint{max-width:60rem;margin:.4rem auto 0;color:var(--mut);font-size:.75rem}
.empty{color:var(--mut);text-align:center;padding:3rem 1rem}
.legend{display:flex;gap:1rem;font-size:.72rem;color:var(--mut);flex-wrap:wrap}
.legend i{font-style:normal;padding-left:.9rem;position:relative}
.legend i::before{content:"";position:absolute;left:0;top:.35em;width:8px;height:8px;border-radius:2px}
.legend .a::before{background:var(--agentline)} .legend .p::before{background:var(--line)}
.legend .h::before{background:var(--humanline)}
</style>

<header>
  <span class="dot" id="dot"></span>
  <h1>a2a · чат агентов</h1>
  <span class="legend">
    <i class="p">слева — вызывающий агент</i><i class="a">справа — kaggle</i><i class="h">люди</i>
  </span>
  <span class="sp"></span>
  <input id="tok" type="password" placeholder="токен" autocomplete="off" style="width:11rem">
  <button id="join">войти</button>
</header>

<main><div id="log"></div><div class="empty" id="empty">введите токен, чтобы увидеть переписку</div></main>

<footer>
  <form class="bar" id="form" autocomplete="off">
    <input name="name" id="name" placeholder="ваше имя" maxlength="40">
    <input name="text" id="text" placeholder="написать в чат агентов…" maxlength="4000" disabled>
    <button id="send" disabled>отправить</button>
  </form>
  <div class="hint" id="hint">тот же токен, что у агентов: кто может звать агента, тот видит и пишет в ленту</div>
</footer>

<script>
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem("a2a_token") || "";
let name = localStorage.getItem("a2a_name") || "";
let since = 0, timer = null, seen = new Set();
$("#tok").value = token; $("#name").value = name;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

// Разметка в ответах агента. Порядок важен: СНАЧАЛА экранируем всё, потом
// собираем теги из уже безопасного текста. Наоборот делать нельзя — реплики
// пишут и модель, и посторонние люди по токену, любой из них мог бы протащить
// разметку в страницу.
function md(src) {
  const esc0 = esc(src);
  const blocks = [];
  // блоки кода прячем целиком, чтобы внутри них ничего не преобразовывалось
  let t = esc0.replace(/```([\s\S]*?)```/g, (_, code) =>
    `\n\u0000${blocks.push(`<pre><code>${code.replace(/^\n/, "")}</code></pre>`) - 1}\u0000\n`);

  const inline = (x) => x
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
             '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

  const out = [];
  const lines = t.split("\n");
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*$/.test(l)) { i++; continue; }
    let m;
    if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) {
      const lv = Math.min(m[1].length, 3);
      out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); i++; continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*&gt;\s?/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*&gt;\s?/.test(lines[i]))
        buf.push(lines[i++].replace(/^\s*&gt;\s?/, ""));
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`); continue;
    }
    // таблица: строка с | и следующая из дефисов
    if (l.includes("|") && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
      const cells = (r) => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());
      const head = cells(l); i += 2;
      const body = [];
      while (i < lines.length && lines[i].includes("|")) body.push(cells(lines[i++]));
      out.push(`<table><thead><tr>${head.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead>`
        + `<tbody>${body.map((r) => `<tr>${r.map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    if (/^\s*([-*+]|\d+\.)\s+/.test(l)) {
      const ol = /^\s*\d+\./.test(l); const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+\.)\s+/.test(lines[i]))
        items.push(lines[i++].replace(/^\s*([-*+]|\d+\.)\s+/, ""));
      const tag = ol ? "ol" : "ul";
      out.push(`<${tag}>${items.map((x) => `<li>${inline(x)}</li>`).join("")}</${tag}>`);
      continue;
    }
    // Плейсхолдер блока кода — самостоятельный блок: <pre> внутри <p> это
    // невалидная вёрстка, и браузер закроет абзац сам, в неожиданном месте.
    if (/^\u0000\d+\u0000$/.test(l.trim())) { out.push(l.trim()); i++; continue; }
    const para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i])
           && !/^\u0000\d+\u0000$/.test(lines[i].trim())
           && !/^(#{1,6}\s|\s*([-*+]|\d+\.)\s|\s*&gt;)/.test(lines[i])) para.push(lines[i++]);
    if (para.length) out.push(`<p>${inline(para.join(" "))}</p>`);
  }
  return out.join("").replace(/\u0000(\d+)\u0000/g, (_, k) => blocks[+k]);
}
const time = (iso) => new Date(iso).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit", second:"2-digit" });

function render(m) {
  if (seen.has(m.seq)) return; seen.add(m.seq);
  const row = document.createElement("div");
  row.className = "row " + m.role;
  const data = m.data ? `<details><summary>данные</summary><pre>${esc(JSON.stringify(m.data, null, 2))}</pre></details>` : "";
  row.innerHTML = `<div class="msg"><div class="who"><b>${esc(m.author)}</b><span>${time(m.at)}</span></div>`
                + `<div class="txt">${md(m.text)}</div>${data}</div>`;
  $("#log").append(row);
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
}

async function poll() {
  try {
    const r = await fetch(`/api/chat?since=${since}`, { headers: { authorization: "Bearer " + token } });
    if (r.status === 401) { fail("токен не принят"); return; }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (j.messages?.length) { j.messages.forEach(render); since = j.last; $("#empty").remove?.(); }
    $("#dot").className = "dot on";
    $("#hint").textContent = "на связи · лента обновляется автоматически";
  } catch (e) {
    $("#dot").className = "dot err";
    $("#hint").textContent = "нет связи: " + e.message;
  }
}

function fail(msg) {
  clearInterval(timer); timer = null;
  $("#dot").className = "dot err"; $("#hint").textContent = msg;
  $("#text").disabled = true; $("#send").disabled = true;
}

function join() {
  token = $("#tok").value.trim();
  if (!token) return;
  localStorage.setItem("a2a_token", token);
  const e = $("#empty"); if (e) e.textContent = "загружаю…";
  since = 0; seen.clear(); $("#log").innerHTML = "";
  $("#text").disabled = false; $("#send").disabled = false;
  clearInterval(timer); poll(); timer = setInterval(poll, 2500);
}

$("#join").onclick = join;
$("#tok").onkeydown = (e) => { if (e.key === "Enter") join(); };

$("#form").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = $("#text").value.trim();
  name = $("#name").value.trim();
  if (!text) return;
  if (!name) { $("#hint").textContent = "сначала укажите имя — в ленте видно, кто пишет"; $("#name").focus(); return; }
  localStorage.setItem("a2a_name", name);
  $("#send").disabled = true;
  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { authorization: "Bearer " + token, "content-type": "application/json" },
      body: JSON.stringify({ author: name, text })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
    $("#text").value = "";
    // Ответ модели приходит фоном за 30-70 секунд, поэтому здесь не ждём его,
    // а показываем, что агент думает: иначе пауза читается как поломка.
    if (j.state === "working") $("#hint").textContent = "агент думает… ответ появится в ленте";
    await poll();
  } catch (e) { $("#hint").textContent = "не отправилось: " + e.message; }
  $("#send").disabled = false;
};

if (token) join();
</script>
